<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; connect-src https://vgztukggtcjebqnkkwxf.supabase.co; img-src 'self' data: blob:; base-uri 'none'; form-action 'none'; object-src 'none'">
<meta name="referrer" content="no-referrer">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#111315">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="สมุดเงิน">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-180.png">
<link rel="manifest" href="manifest.webmanifest">
<title>สมุดเงินของ Dan</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;500;600;700&display=swap">
<style>
/* โครง: มือถือ = หัวด้านบน + เมนูล่าง 4 ส่วน + ปุ่มบันทึกกลาง · iMac ≥ 960px = เมนูซ้าย + แถบสมุด/เดือนด้านบน */
:root {
  --bg: #111315;
  --surface: #1B1E22;
  --surface-2: #24282D;
  --fg: #F4F4F5;
  --muted: #B5B8BE;
  --line: #363A40;
  --field-line: #6B7079;
  --income: #75D6A3;
  --expense: #FF9A92;
  --transfer: #8FBFFF;
  --warn: #E6C878;
  --grid: #2A2E33;
  --axis: #4A4F57;
  --c1: #3987e5; --c2: #d95926; --c3: #199e70; --c4: #c98500; --c5: #d55181; --c-other: #6B7079;
  --on-light: #111315;
  --font: 'IBM Plex Sans Thai', Thonburi, 'Sukhumvit Set', system-ui, sans-serif;
  --r: 14px;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { background: var(--bg); color: var(--fg); }
body { font-family: var(--font); font-size: 1rem; line-height: 1.6; -webkit-font-smoothing: antialiased; }
body.lock { overflow: hidden; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 30; background: var(--bg); }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--transfer); outline-offset: 2px; }
.num, .amt, td.n { font-variant-numeric: tabular-nums; }
h1, h2, h3 { margin: 0; line-height: 1.35; text-wrap: balance; }
h2 { font-size: 1.05rem; font-weight: 600; }
p { margin: 0; }
.muted { color: var(--muted); }
.small { font-size: .875rem; }
.income { color: var(--income); } .expense { color: var(--expense); } .transfer { color: var(--transfer); } .warn { color: var(--warn); }
.draftc { color: var(--muted); }

/* ---------- โครงหลัก ---------- */
.app { min-height: 100%; }
.side { display: none; }
.top {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: var(--bg);
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 10px 12px; border-bottom: 1px solid var(--line);
  display: grid; gap: 10px;
}
.top-row { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; justify-content: space-between; }
.brand { font-weight: 700; font-size: 1.1rem; letter-spacing: .01em; }
.chips { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
.chip { display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--line); border-radius: 999px; padding: 2px 10px; font-size: .8rem; color: var(--muted); white-space: nowrap; }
.chip .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--muted); }
.chip.ok .dot { background: var(--income); } .chip.busy .dot { background: var(--warn); } .chip.bad .dot { background: var(--expense); }
.chip.bad { color: var(--expense); border-color: var(--expense); }
.controls { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.seg { display: inline-flex; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 3px; gap: 2px; }
.seg button { border: 0; background: transparent; border-radius: 9px; padding: 8px 14px; min-height: 40px; color: var(--muted); font-weight: 500; white-space: nowrap; }
.seg button[aria-pressed="true"] { background: var(--fg); color: var(--on-light); font-weight: 600; }
.seg .sep { width: 1px; background: var(--line); margin: 6px 2px; }
select.month, .field select, .field input, .field textarea, .search input, .filters select, .filters input {
  background: var(--surface); border: 1px solid var(--field-line); border-radius: 10px; padding: 8px 12px; min-height: 44px; width: 100%;
}
select.month { width: auto; }
main.view {
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 16px calc(100px + env(safe-area-inset-bottom, 0px));
  display: grid; gap: 16px; max-width: 1180px;
}
.tabs {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 25; background: var(--surface); border-top: 1px solid var(--line);
  padding-left: max(8px, env(safe-area-inset-left, 0px)); padding-right: max(8px, env(safe-area-inset-right, 0px));
  padding-bottom: env(safe-area-inset-bottom, 0px);
  display: grid; grid-template-columns: repeat(5, 1fr); align-items: center;
}
.tabs button { border: 0; background: none; min-height: 58px; color: var(--muted); font-size: .8rem; display: grid; place-items: center; gap: 2px; padding: 6px 2px; }
.tabs button svg { width: 22px; height: 22px; }
.tabs button[aria-current="page"] { color: var(--fg); font-weight: 600; }
.tabs .add { background: var(--fg); color: var(--on-light); border-radius: 14px; min-height: 46px; margin: 0 4px; font-weight: 600; font-size: .85rem; grid-auto-flow: column; gap: 4px; }
.tabs .add svg { width: 18px; height: 18px; }

/* ---------- ชิ้นส่วน ---------- */
.card { background: var(--surface); border-radius: var(--r); padding: 16px; display: grid; gap: 12px; min-width: 0; }
.card-h { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; flex-wrap: wrap; }
.linkbtn { border: 0; background: none; color: var(--fg); text-decoration: underline; text-underline-offset: 3px; padding: 8px 0; min-height: 44px; }
.btn { border: 1px solid var(--field-line); background: var(--surface-2); border-radius: 10px; padding: 8px 14px; min-height: 44px; font-weight: 500; }
.btn.primary { background: var(--fg); color: var(--on-light); border-color: var(--fg); font-weight: 600; }
.btn.danger { color: var(--expense); border-color: var(--expense); background: transparent; }
.btn:disabled { opacity: .5; cursor: not-allowed; }
.stats { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; }
.stat { background: var(--surface); border-radius: var(--r); padding: 12px 14px; display: grid; gap: 2px; min-width: 0; }
.stat .lbl { font-size: .85rem; color: var(--muted); }
.stat .val { font-size: clamp(1.05rem, 4.6vw, 1.6rem); font-weight: 600; line-height: 1.25; overflow-wrap: anywhere; }
.stat .unit { font-size: .8rem; color: var(--muted); }
.note { font-size: .82rem; color: var(--muted); }
.banner { border: 1px solid var(--warn); border-radius: var(--r); padding: 12px 14px; display: flex; gap: 10px; align-items: center; justify-content: space-between; flex-wrap: wrap; }
.banner.info { border-color: var(--line); }
.banner p { min-width: 0; flex: 1 1 220px; }
.bar { height: 10px; background: var(--surface-2); border-radius: 99px; overflow: hidden; }
.bar > i { display: block; height: 100%; background: var(--fg); border-radius: 99px; }
.bar.warnbar > i { background: var(--warn); } .bar.over > i { background: var(--expense); }
.bar.exp > i { background: var(--expense); } .bar.goal > i { background: var(--income); }
.catrow { display: grid; gap: 4px; }
.catrow .t { display: flex; justify-content: space-between; gap: 8px; }
.split { display: grid; gap: 0; }
.split .r { display: grid; grid-template-columns: 1fr repeat(3, auto); gap: 12px; padding: 8px 0; border-bottom: 1px solid var(--line); align-items: baseline; }
.split .r:last-child { border-bottom: 0; }
.split .r span:not(:first-child) { text-align: right; font-variant-numeric: tabular-nums; }

/* รายการ */
.list { display: grid; }
.daygrp { font-size: .85rem; color: var(--muted); padding: 12px 0 4px; }
.row { display: grid; grid-template-columns: 1fr auto; gap: 4px 12px; padding: 10px 4px; border-bottom: 1px solid var(--line); background: none; border-left: 0; border-right: 0; border-top: 0; text-align: left; width: 100%; min-height: 56px; align-items: center; }
.row:hover { background: var(--surface-2); }
.row .t1 { font-weight: 500; overflow-wrap: anywhere; }
.row .t2 { font-size: .82rem; color: var(--muted); grid-column: 1; }
.row .amt { grid-row: 1 / span 2; grid-column: 2; text-align: right; font-weight: 600; }
.row .amt small { display: block; font-weight: 400; font-size: .75rem; color: var(--muted); }
.tag { display: inline-block; font-size: .72rem; border: 1px solid currentColor; border-radius: 6px; padding: 0 6px; margin-left: 6px; vertical-align: 1px; }
.search { display: grid; gap: 8px; }
.filters { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
.filters label, .field label, .field .lab { font-size: .82rem; color: var(--muted); display: block; margin-bottom: 4px; }
.tablewrap { overflow-x: auto; display: none; }
table { border-collapse: collapse; width: 100%; font-size: .92rem; }
th, td { text-align: left; padding: 10px 10px; border-bottom: 1px solid var(--line); white-space: nowrap; }
th { color: var(--muted); font-weight: 500; font-size: .82rem; }
td.n, th.n { text-align: right; }
tbody tr { cursor: pointer; } tbody tr:hover { background: var(--surface-2); }
tbody tr:focus-visible { outline-offset: -2px; }

/* แผ่นฟอร์ม */
.sheet-bg { position: fixed; inset: 0; background: rgba(0,0,0,.6); z-index: 40; display: flex; align-items: flex-end; justify-content: center; }
.sheet { background: var(--bg); border: 1px solid var(--line); border-radius: 18px 18px 0 0; width: 100%; max-width: 620px; max-height: 94%; overflow-y: auto; overscroll-behavior: contain;
  padding-bottom: calc(24px + env(safe-area-inset-bottom, 0px)); }
.sheet-h { position: sticky; top: 0; background: var(--bg); z-index: 2; display: grid; grid-template-columns: auto 1fr auto; align-items: center; gap: 8px; padding: 10px 12px; border-bottom: 1px solid var(--line); }
.sheet-h h2 { text-align: center; }
.sheet-b { padding: 16px max(16px, env(safe-area-inset-left, 0px)) 0 max(16px, env(safe-area-inset-right, 0px)); display: grid; gap: 14px; }
.field { display: grid; gap: 2px; min-width: 0; }
.field .seg { width: 100%; } .field .seg button { flex: 1; }
.amount-in { font-size: 1.6rem !important; font-weight: 600; font-variant-numeric: tabular-nums; }
.two { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
.check { display: flex; gap: 10px; align-items: flex-start; padding: 10px 12px; border: 1px solid var(--field-line); border-radius: 10px; min-height: 44px; }
.check input { width: 20px; height: 20px; margin-top: 3px; flex: none; }
.err { color: var(--expense); font-size: .85rem; }
.summary { border: 1px dashed var(--field-line); border-radius: 12px; padding: 12px 14px; display: grid; gap: 4px; }
.status { border-radius: 12px; padding: 12px 14px; display: grid; gap: 6px; }
.status.bad { border: 1px solid var(--expense); }
.status.busy { border: 1px solid var(--warn); }
.kv { display: grid; grid-template-columns: auto 1fr; gap: 6px 14px; }
.kv dt { color: var(--muted); font-size: .88rem; } .kv dd { margin: 0; overflow-wrap: anywhere; }
.actions { display: flex; gap: 8px; flex-wrap: wrap; }
.toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(80px + env(safe-area-inset-bottom, 0px)); z-index: 50; background: var(--fg); color: var(--on-light); padding: 10px 16px; border-radius: 12px; font-weight: 500; max-width: calc(100% - 32px); box-shadow: 0 6px 24px rgba(0,0,0,.5); }
.acc { display: grid; gap: 8px; }
.acc > div > button { display: flex; justify-content: space-between; align-items: center; width: 100%; background: var(--surface); border: 0; border-radius: var(--r); padding: 14px 16px; min-height: 52px; text-align: left; font-weight: 500; }
.acc > div > button[aria-expanded="true"] { border-radius: var(--r) var(--r) 0 0; }
.acc .panel { background: var(--surface); border-radius: 0 0 var(--r) var(--r); padding: 4px 16px 16px; display: grid; gap: 10px; min-width: 0; }
textarea.csv { width: 100%; min-height: 160px; font-family: ui-monospace, Menlo, monospace; font-size: .78rem; background: var(--bg); border: 1px solid var(--field-line); border-radius: 10px; padding: 10px; }
.testrow { display: grid; grid-template-columns: auto 1fr; gap: 2px 10px; padding: 8px 0; border-bottom: 1px solid var(--line); }
.testrow .d { grid-column: 2; font-size: .82rem; color: var(--muted); }
.empty { text-align: center; padding: 28px 16px; display: grid; gap: 10px; justify-items: center; }
.empty ol { text-align: left; margin: 0; padding-left: 1.2em; }
.overview-grid { display: grid; gap: 16px; }
.overview-grid > div { display: grid; gap: 16px; align-content: start; min-width: 0; }
.radio { display: flex; gap: 10px; align-items: center; min-height: 44px; }
.radio input { width: 20px; height: 20px; }
.kbd { font-family: ui-monospace, Menlo, monospace; border: 1px solid var(--field-line); border-radius: 5px; padding: 0 5px; font-size: .78rem; }

/* แผนภูมิ */
.chart { width: 100%; min-width: 0; }
.chart svg { display: block; overflow: visible; max-width: 100%; }
.chart svg text { font-family: var(--font); fill: var(--muted); font-size: 12px; }
.chart svg text.strong { fill: var(--fg); font-weight: 600; }
.legend { display: flex; flex-wrap: wrap; gap: 6px 16px; font-size: .85rem; color: var(--muted); }
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.legend i { width: 12px; height: 12px; border-radius: 3px; display: inline-block; flex: none; }
.legend i.ln { height: 2px; width: 18px; border-radius: 1px; }
.legend i.dash { height: 0; width: 18px; border-top: 2px dashed var(--muted); border-radius: 0; }
.hit { outline: none; }
.hit .band { fill: transparent; }
.hit:hover .band, .hit:focus-visible .band { fill: rgba(255,255,255,.05); }
.hit .xh { opacity: 0; }
.hit:hover .xh, .hit:focus-visible .xh { opacity: 1; }
.hit:hover .mk, .hit:focus-visible .mk { filter: brightness(1.18); }
.catrow.hit:hover, .catrow.hit:focus-visible { background: var(--surface-2); border-radius: 8px; }
.catrow.hit { padding: 4px 6px; margin: 0 -6px; }
.tip { position: fixed; z-index: 60; pointer-events: none; background: #2A2E33; border: 1px solid var(--field-line); border-radius: 10px; padding: 8px 10px; font-size: .85rem; max-width: 250px; box-shadow: 0 6px 20px rgba(0,0,0,.5); display: grid; gap: 1px; }
.tip .tip-h { color: var(--muted); font-size: .78rem; }
.tip .tip-r { display: flex; align-items: center; gap: 8px; }
.tip .tip-r i { width: 12px; height: 2px; flex: none; }
.tip .tip-r b { font-weight: 600; font-variant-numeric: tabular-nums; }
details.tbl summary { cursor: pointer; text-decoration: underline; text-underline-offset: 3px; min-height: 44px; display: flex; align-items: center; font-size: .9rem; width: fit-content; }
details.tbl .tw { overflow-x: auto; }
.why { font-size: .85rem; color: var(--muted); border-left: 2px solid var(--line); padding-left: 10px; }
.donut-wrap { display: flex; gap: 16px 24px; flex-wrap: wrap; align-items: center; }
.donut-wrap .legend { flex-direction: column; flex: 1 1 200px; min-width: 0; }
.donut-wrap .legend span { justify-content: space-between; gap: 12px; }
.donut-wrap .legend span em { font-style: normal; color: var(--fg); font-variant-numeric: tabular-nums; white-space: nowrap; }

/* รอบ 2: หน้าล็อกอิน · ปุ่มใช้บ่อย · รายการตั้งค่า */
[hidden] { display: none !important; }
.gate { min-height: 100vh; display: grid; place-items: center; padding: max(24px, env(safe-area-inset-top, 0px)) 16px max(24px, env(safe-area-inset-bottom, 0px)); }
.gate .card { width: 100%; max-width: 400px; gap: 14px; }
.gate h1 { font-size: 1.3rem; }
.gate form { display: grid; gap: 12px; }
.qchips { display: flex; gap: 8px; flex-wrap: wrap; }
.qchip { border: 1px solid var(--field-line); background: var(--surface); border-radius: 999px; padding: 6px 14px; min-height: 40px; font-weight: 500; }
.qchip small { color: var(--muted); font-weight: 400; margin-left: 4px; }
.erow { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 8px 0; border-bottom: 1px solid var(--line); min-height: 52px; }
.erow:last-child { border-bottom: 0; }
.erow > span { min-width: 0; overflow-wrap: anywhere; }
.erow .btn { flex: none; }
button.erow { width: 100%; background: none; border: 0; border-bottom: 1px solid var(--line); color: inherit; font: inherit; text-align: left; padding: 4px 2px; min-height: 44px; }
button.erow:last-child { border-bottom: 0; }
button.erow:hover { background: var(--surface-2); }
button.erow .go { color: var(--muted); margin-left: 6px; }
.row.open-bal { cursor: default; background: var(--surface-2); }
.catchips { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 4px; }
.catchips button { border: 1px solid var(--line); background: var(--surface-2); border-radius: 8px; padding: 4px 10px; min-height: 36px; }
.catchips button.add { border-style: dashed; color: var(--muted); background: transparent; }
.catchips button.arch { color: var(--muted); text-decoration: line-through; }

@media (max-width: 420px) {
  .acc .panel th, .acc .panel td, details.tbl th, details.tbl td { padding: 8px 6px; font-size: .84rem; }
  .stats { grid-template-columns: 1fr 1fr; }
  .stats .stat:last-child { grid-column: 1 / -1; }
  .seg button { padding: 8px 10px; }
}

/* ---------- iMac ---------- */
@media (min-width: 960px) {
  .app { display: grid; grid-template-columns: 236px minmax(0, 1fr); }
  .side { display: flex; flex-direction: column; gap: 6px; position: sticky; top: 0; height: 100vh; padding: 20px 14px; border-right: 1px solid var(--line); background: var(--bg); }
  .side .brand { padding: 4px 10px 14px; }
  .side nav { display: grid; gap: 2px; }
  .side nav button { display: flex; gap: 10px; align-items: center; border: 0; background: none; border-radius: 10px; padding: 10px 12px; min-height: 44px; color: var(--muted); text-align: left; font-weight: 500; }
  .side nav button svg { width: 20px; height: 20px; }
  .side nav button[aria-current="page"] { background: var(--surface); color: var(--fg); }
  .side .btn.primary { margin-top: 12px; }
  .side .hint { margin-top: auto; font-size: .78rem; color: var(--muted); padding: 0 10px; }
  .top { padding-block: 14px; }
  .top .brand { display: none; }
  .top { grid-template-columns: 1fr auto; align-items: center; }
  .tabs { display: none; }
  main.view { padding-block: 22px 40px; }
  .overview-grid { grid-template-columns: minmax(0, 1.35fr) minmax(0, 1fr); align-items: start; }
  .tablewrap { display: block; }
  .list.mobile { display: none; }
  .filters { grid-template-columns: repeat(5, minmax(0, 1fr)); }
  .search { grid-template-columns: minmax(0, 1fr); }
  .sheet-bg { align-items: center; }
  .sheet { border-radius: 18px; max-height: 90%; }
  .toast { bottom: 28px; }
}
@media (prefers-reduced-motion: no-preference) {
  .sheet { animation: up .18s ease-out; }
  @keyframes up { from { transform: translateY(16px); opacity: .6; } to { transform: none; opacity: 1; } }
}
</style>

<style>html,body{margin:0}</style>
</head>
<body>
<div id="gate" class="gate" hidden></div>
<div class="app" id="app" hidden>
  <aside class="side" aria-label="เมนูหลัก">
    <div class="brand">สมุดเงิน</div>
    <nav id="sidenav"></nav>
    <button class="btn primary" data-act="new">+ บันทึกรายการ</button>
    <p class="hint">คีย์ลัด: <span class="kbd">N</span> บันทึกใหม่ · <span class="kbd">/</span> ค้นหา · <span class="kbd">Esc</span> ปิด</p>
  </aside>
  <div class="main">
    <header class="top" id="top"></header>
    <main class="view" id="view"></main>
  </div>
  <nav class="tabs" id="tabs" aria-label="เมนูหลัก"></nav>
</div>
<div id="sheetRoot"></div>
<div id="toastRoot" aria-live="polite"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.118.0/dist/umd/supabase.js" integrity="sha384-TcHRA3zBbn+Lexh5n+Oil4guNPOS3rjNDpGRAN46u/s/mB2IZ50ceC6TYDU2yvgK" crossorigin="anonymous"></script>
<script src="ledger.js"></script>
<script src="ledger-tests.js"></script>
<script src="remote.js"></script>
<script>
(function () {
'use strict';

function server(fn) {
  var mode = S.next; S.next = 'ok';
  return new Promise(function (resolve, reject) {
    setTimeout(function () {
      if (mode === 'before') return reject(new Error('ส่งข้อมูลไปไม่ถึงระบบ (จำลองเน็ตหลุดก่อนส่ง)'));
      var r = fn();
      if (!r.ok) return reject(Object.assign(new Error(r.error || 'บันทึกไม่ผ่าน'), { conflict: r.conflict }));
      if (mode === 'after') return reject(new Error('ระบบอาจได้รับแล้ว แต่ไม่ได้รับคำตอบกลับ (จำลองเน็ตหลุดหลังส่ง)'));
      resolve(r);
    }, S.slow ? 3000 : 900);
  });
}

    var x = store.addAccount({ name: a.name, kind: a.kind, openingDate: a.openingDate, opening: a.hasOpening ? a.opening : null }); x.bankHint = a.bankHint; return ok();
  },
  saveCategory: function (c) { if (c.id) Object.assign(store.category(c.id), c); else store.addCategory(c); return ok(); },
  addCategories: function (list) { list.forEach(function (c) { store.addCategory(c); }); return ok(); },
  saveProject: function (p) { if (p.id) Object.assign(store.project(p.id), p); else store.addProject(p); return ok(); },
  setBudget: function (book, month, total, cats) {
    if (total == null) store.budgets = store.budgets.filter(function (b) { return !(b.book === book && b.month === month); });
    else store.setBudget({ book: book, month: month, total: total, categories: cats });
    return ok();
  },
  saveGoal: function (g) { if (g.id) Object.assign(store.goals.find(function (x) { return x.id === g.id; }), g); else store.addGoal(g); return ok(); },
  reserve: function (id, amt, date) { return ok(store.reserve(id, amt, date)); },
  saveQuick: function (q) {
    if (q.id) Object.assign(store.quick.find(function (x) { return x.id === q.id; }), q);
    else store.quick.push(Object.assign({ id: 'q-' + Date.now().toString(36) }, q));
    return ok();
  },
  deleteQuick: function (id) { store.quick = store.quick.filter(function (x) { return x.id !== id; }); return ok(); },
  saveRecurring: function (r) {
    if (r.id) Object.assign(store.recurring.find(function (x) { return x.id === r.id; }), r);
    else store.recurring.push(Object.assign({ id: 'rec-' + Date.now().toString(36), active: true }, r));
    return ok();
  },
  deleteRecurring: function (id) { store.recurring = store.recurring.filter(function (x) { return x.id !== id; }); return ok(); },
  runRecurring: function (today) { // เลียนแบบ run_recurring ของฐานข้อมูล
    var made = 0;
    store.recurring.forEach(function (r) {
      var guard = 0;
      while (r.active && r.nextDate <= today && guard++ < 12) {
        var res = store.save(Object.assign(tplToInput(r.template), { requestId: 'rec:' + r.id + ':' + r.nextDate, status: 'draft', source: 'recurring', date: r.nextDate, title: r.template.title || r.name }));
        if (res.ok && !res.duplicate) made += 1;
        r.nextDate = nextMonthDay(r.nextDate, r.dayOfMonth);
      }
    });
    return ok(made);
  },
  backup: function () { return ok({ format: 'dan-finance-demo', note: 'ข้อมูลสมมติ ไม่ใช่ไฟล์สำรองจริง', taken_at: new Date().toISOString(), accounts: store.accounts, categories: store.categories, transactions: store.events, budgets: store.budgets, goals: store.goals }); },
  reload: function () { return ok(); }
};

/** วันที่ครั้งถัดไปของรายการประจำ (เดือนถัดไป วันที่เดิม · เดือนที่สั้นกว่าใช้วันสุดท้าย) — ตรงกับ recurring_next ในฐานข้อมูล */
function nextMonthDay(d, day) {
  var ym = addMonths(d.slice(0, 7), 1), last = +L.monthRange(ym).to.slice(8);
  return ym + '-' + String(Math.min(day, last)).padStart(2, '0');
}
/** ต้นแบบรายการ (ช่องแบบฐานข้อมูล) → ข้อมูลบันทึก */
function tplToInput(t) {
  var e = R.rowToTx(Object.assign({ title: '', note: '' }, t));
  var o = {};
  ['kind', 'book', 'amount', 'categoryId', 'accountId', 'fundedBy', 'projectId', 'payee', 'title', 'note', 'fromAccount', 'toAccount', 'fromBook', 'toBook'].forEach(function (k) { if (e[k] != null && e[k] !== '') o[k] = e[k]; });
  if (!o.amount) delete o.amount;
  return o;
}
/** ฟอร์มบันทึก → ต้นแบบรายการ (ไม่เก็บวันที่ หมายเหตุ หรือรหัสคำขอ) */
function formToTpl() {
  var i = buildInput();
  var t = R.txToRow(i);
  ['request_id', 'status', 'source', 'date', 'note', 'source_ref', 'occurred_at', 'deleted_at', 'refund_of', 'settles_due'].forEach(function (k) { delete t[k]; });
  if (!t.amount) delete t.amount;
  Object.keys(t).forEach(function (k) { if (t[k] === null || t[k] === '') delete t[k]; });
  return t;
}

  return k + ' · ' + bk + ' · ' + (t.amount ? money(t.amount) + ' บาท' : 'ใส่ยอดตอนบันทึก') + (t.category_id ? ' · ' + catName(t.category_id) : '');
}

var loading = null, lastLoad = 0;
function reload() {
  if (MODE !== 'live') return ok();

  loading = api.loadAll().then(function (raw) {
    store = R.buildStore(L, raw);
    S.check = R.crossCheck(store, L);
    lastLoad = Date.now();
    loading = null;
    if (S.sync.state !== 'saving') S.sync = { state: 'loaded', at: new Date() };
  }, function (err) {
    loading = null;
    if (/JWT|permission denied|401/.test(err.message || '')) { client.auth.getSession().then(function (r) { if (!r.data.session) showGate('เซสชันหมดอายุ ล็อกอินอีกครั้ง'); }); }
    throw err;

/** เงินคงเหลือตอนนี้ (รวมทุกรายการที่บันทึกแล้ว ไม่ขึ้นกับเดือนที่เลือก) · สมุดส่วนตัว/งาน = ส่วนของสมุดนั้นในแต่ละบัญชี · รวม = ยอดจริงในบัญชี */
function balanceCard(bal) {

  var bc = bankChecks();

// ---------- หน้าบัญชี (แตะชื่อบัญชีในการ์ดยอดเงิน) ----------
/** รายการที่บันทึกแล้วซึ่งแตะบัญชีนี้ เรียงเก่าไปใหม่ พร้อมยอดคงเหลือหลังแต่ละรายการ
 *  ยอดคงเหลือนับย้อนจากยอดปัจจุบันของการ์ดยอดเงิน ตัวเลขจึงตรงกับการ์ดเสมอ */
function accountLedger(id, nowReal) {
  var key = function (e) { return e.date + '|' + (e.occurredAt || '') + '|' + (e.createdAt || '') + '|' + e.id; };
  var rows = [];
  store.counted().forEach(function (e) {

var tipEl = document.createElement('div'); tipEl.className = 'tip'; tipEl.hidden = true; tipEl.setAttribute('aria-hidden', 'true'); document.body.appendChild(tipEl);
function showTip(t, px, py) {
  tipEl.textContent = '';
  t.getAttribute('data-tip').split('\n').forEach(function (ln, i) {
    var row = document.createElement('div');

      var nm = document.createElement('span'); nm.textContent = p[2]; row.appendChild(nm);

  var w = tipEl.offsetWidth, h = tipEl.offsetHeight;
  var x = Math.min(window.innerWidth - w - 8, Math.max(8, px + 14)), y = py - h - 12;

function submit() {

  p.then(function (r) {
    var back = store.get(r.event.id); // อ่านกลับจากระบบก่อนบอกว่าบันทึกแล้ว
    if (!back) throw new Error('บันทึกแล้วแต่ยังอ่านกลับไม่เจอ กดโหลดข้อมูลใหม่');
    setSync('saved');
    closeSheet();
    toast('บันทึกแล้ว · รหัส ' + String(back.id).slice(0, 8) + (r.duplicate ? ' (ระบบมีรายการนี้จากครั้งก่อน ไม่ได้สร้างซ้ำ)' : ''));
    render();
  }).catch(function (err) {
    if (!F) return;
    F.saving = false;
    F.conflict = !!err.conflict;
    F.error = err.conflict ? 'รายการนี้ถูกแก้จากอีกเครื่องก่อน ระบบไม่ได้เขียนทับ' : /fetch|network|Load failed/i.test(err.message) ? 'ต่อเน็ตไม่ได้ (' + err.message + ')' : err.message;
    setSync('failed'); renderSheet();
  });
}

    job = function () { return DB().saveCategory({ id: G.id, book: G.book, type: G.ctype, name: G.name.trim(), archived: !!G.archived, sort: G.id ? null : store.categories.filter(function (c) { return c.book === G.book && c.type === G.ctype; }).length }); };

    F[el.dataset.f] = el.type === 'checkbox' ? el.checked : el.value;
    if (el.dataset.f === 'onBehalf' || el.dataset.f === 'settlesDue') { renderSheet(); return; }
    var s = document.getElementById('fsum'); if (s) s.innerHTML = '<span class="small muted">สรุปก่อนบันทึก</span>' + summaryText();
  }
});
var qTimer;
document.addEventListener('input', function (ev) {
  var el = ev.target;
  if (el.dataset.q === 'text') {
    S.q.text = el.value; clearTimeout(qTimer);
    qTimer = setTimeout(function () { var pos = el.selectionStart; renderList(); var n = document.getElementById('qtext'); if (n) { n.focus(); try { n.setSelectionRange(pos, pos); } catch (x) {} } }, 250);
    return;
  }
  if (G && (el.dataset.g || el.dataset.gc) && el.type !== 'checkbox') {
    if (el.dataset.gc) G.cats[el.dataset.gc] = el.value; else G[el.dataset.g] = el.value;
    if (G.errors && G.errors[el.dataset.g]) delete G.errors[el.dataset.g];
    if (G.type === 'budget') { var gs = document.getElementById('gbsum'); if (gs) { var sc = Object.keys(G.cats).reduce(function (t, k) { return t + (L.toSatang(G.cats[k]) || 0); }, 0); gs.innerHTML = 'รวมงบหมวด ' + money(sc) + ' บาท' + (sc > (L.toSatang(G.total) || 0) ? ' · <span class="warn">มากกว่างบรวม</span>' : ''); } }
    return;
  }
  if (F && el.dataset.f && el.type !== 'checkbox') {
    F[el.dataset.f] = el.value;
    if (F.errors && F.errors[el.dataset.f]) { delete F.errors[el.dataset.f]; }
    var s = document.getElementById('fsum'); if (s) s.innerHTML = '<span class="small muted">สรุปก่อนบันทึก</span>' + summaryText();
  }
});
document.addEventListener('keydown', function (ev) {
  var typing = /INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName);
  if (ev.key === 'Escape' && (F || detailId || G)) { if (!(F && F.saving) && !(G && G.saving)) closeG(); return; }
  if (ev.key === 'Enter' && document.activeElement.matches('tr[data-act="detail"]')) { document.activeElement.click(); return; }
  if (ev.key === 'Enter' && F && typing && document.activeElement.tagName === 'INPUT' && (ev.metaKey || ev.ctrlKey)) { submit(); return; }
  if (!MODE || typing || F || detailId || G || ev.metaKey || ev.ctrlKey || ev.altKey) return;
  if (ev.key === 'n' || ev.key === 'N' || ev.key === 'ด') { ev.preventDefault(); openForm(); }
  if (ev.key === '/') { ev.preventDefault(); S.view = 'list'; render(); var q = document.getElementById('qtext'); if (q) q.focus(); }
});

function ensureClient() {
  if (client || !window.supabase) return client;
  client = window.supabase.createClient(CFG.url, CFG.key, { auth: { persistSession: true, autoRefreshToken: true, detectSessionInUrl: false, storageKey: 'danfinance-auth' + (CFG.mock ? '-mock' : '') } });
  client.auth.onAuthStateChange(function (event) { if (event === 'SIGNED_OUT' && MODE === 'live') showGate('ออกจากระบบแล้ว'); });
  return client;
}
function closeG() { if (G && G.back) { F = G.back; G = null; renderSheet(); } else closeSheet(); }

// ---------- เริ่ม ----------
(function boot() {
  var qs = new URLSearchParams(location.search);
  if (qs.get('demo') === '1' || !window.supabase) {
    if (!window.supabase && qs.get('demo') !== '1') { showGate(); return; }
    return startDemo();
  }
  ensureClient().auth.getSession().then(function (r) {
    var sess = r.data && r.data.session;
    if (sess) startLive(sess.user); else showGate();
  }, function () { showGate(); });
})();
})();
</script>
